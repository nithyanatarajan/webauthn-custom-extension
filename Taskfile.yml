version: '3'

vars:
  RP_PORT: '8000'
  EXT_PORT: '9000'
  WEB_PORT: '5173'
  FRONTEND_DIR: frontend
  BACKEND_DIR: backend
  WEB_DIR: '{{.FRONTEND_DIR}}/passkey_web'
  PASSKEY_SERVER_DIR: '{{.BACKEND_DIR}}/apps/passkey_server'
  EXTENSION_SERVER_DIR: '{{.BACKEND_DIR}}/apps/extension_server'
  ENV_DIRS: '{{.PASSKEY_SERVER_DIR}} {{.EXTENSION_SERVER_DIR}} {{.WEB_DIR}}'

tasks:

  default:
    silent: true
    cmds:
      - task --list

  # ---------- Install / Setup ----------
  install:
    desc: Install all deps (backend + frontend)
    deps: [ install:backend, install:frontend ]

  install:backend:
    desc: "Create virtualenv and sync all dependencies"
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - uv venv --allow-existing --python 3.12
      - uv sync --all-extras --dev

  install:frontend:
    desc: "Install frontend dependencies"
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm install

  # ---------- Env Setup ----------
  env:setup:
    desc: Copy .env.example to .env if missing
    cmds:
      - for d in {{.ENV_DIRS}}; do if [ ! -f "$d/.env" ] && [ -f "$d/.env.example" ]; then cp "$d/.env.example" "$d/.env" && echo "[env:setup] Copied $d/.env.example -> $d/.env"; fi; done

  # ---------- Dev Servers ----------
  dev:
    desc: Run all servers and client in parallel
    cmds:
      - |
        task dev:ext &
        task dev:rp &
        task dev:web &
        wait

  dev:rp:
    desc: Start Passkey (Relying Party) Server
    dir: '{{.BACKEND_DIR}}'
    cmd: uv run uvicorn passkey_server.main:app --reload --host 0.0.0.0 --port {{.RP_PORT}} --app-dir apps

  dev:ext:
    desc: Start Extension Server
    dir: '{{.BACKEND_DIR}}'
    cmd: uv run uvicorn extension_server.main:app --reload --host 0.0.0.0 --port {{.EXT_PORT}} --app-dir apps

  dev:web:
    desc: Start Passkey Client (Vite + JS)
    dir: '{{.WEB_DIR}}'
    cmd: npm run dev -- --host --port {{.WEB_PORT}}

  # ---------- Lint / Format / Test (Python) ----------
  ci:py:
    desc: Run all Python checks for CI
    # This task is intended for CI/CD pipelines
    deps: [ lint:py, test:py ]

  lft:py:
    desc: Run all Python checks (lint, format, test)
    deps: [ lint:py, format:py, test:py ]

  lint:py:
    desc: Run ruff checks across backend
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - uv run ruff check .

  format:py:
    desc: Auto-format with ruff
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - uv run ruff format .

  test:py:
    desc: Run pytest across backend
    dir: '{{.BACKEND_DIR}}'
    cmds:
      - uv run pytest -q

  # ---------- Lint / Format / Test (JavaScript) ----------
  ci:js:
    desc: Run all JS checks for CI
    # This task is intended for CI/CD pipelines
    dir: '{{.WEB_DIR}}'
    cmd: npm run ci

  lft:js:
    desc: Run all JS checks (lint, format, test)
    deps: [ lint:js, format:js, test:js ]

  lint:js:
    desc: Run ESLint across frontend
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm run lint:fix

  format:js:
    desc: Auto-format with Prettier
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm run format:fix

  test:js:
    desc: Run frontend tests
    dir: '{{.WEB_DIR}}'
    cmds:
      - npm run test:ci